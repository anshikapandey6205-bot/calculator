<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator | Elegant Pink Edition</title>
  <meta name="description" content="A beautiful, responsive pink-themed scientific calculator with comprehensive functions and calculation history.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-1" aria-hidden="true"></div>
  <div class="ambient-glow glow-2" aria-hidden="true"></div>

  <main class="app-layout">
    <!-- Calculator Card -->
    <section class="calculator-container" aria-label="Scientific Calculator">
      <!-- Calculator Header -->
      <header class="calc-header">
        <div class="brand-badge">
          <span class="sparkle-icon" aria-hidden="true">✦</span>
          <span class="brand-title">RoseCalc</span>
          <span class="brand-tag">Scientific</span>
        </div>
        <div class="header-actions">
          <!-- DEG / RAD Switch -->
          <button id="degRadBtn" class="mode-pill" type="button" aria-label="Toggle Angle Mode: Current is DEG">
            <span class="pill-slider" id="pillSlider"></span>
            <span class="pill-label pill-deg active" id="degLabel">DEG</span>
            <span class="pill-label pill-rad" id="radLabel">RAD</span>
          </button>
          
          <!-- History Drawer Toggle Button -->
          <button id="historyToggleBtn" class="icon-btn" type="button" title="View Calculation History" aria-label="Toggle History Panel">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span class="badge" id="historyBadge">0</span>
          </button>
        </div>
      </header>

      <!-- Calculator Display -->
      <div class="calc-display" id="displayArea">
        <!-- Display Meta Info & Controls -->
        <div class="display-status-bar">
          <div class="status-indicators">
            <span class="status-chip angle-chip" id="currentAngleChip">DEG</span>
            <span class="status-chip paren-chip hidden" id="parenChip" title="Unclosed Parentheses">() 0</span>
          </div>
          <button id="copyBtn" class="copy-action-btn" type="button" title="Copy answer to clipboard" aria-label="Copy answer">
            <svg class="icon copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span class="copy-toast" id="copyToast" aria-hidden="true">Copied!</span>
          </button>
        </div>

        <!-- Expression Line (formula being constructed) -->
        <div class="display-expression-container" id="expressionContainer">
          <div class="display-expression" id="expressionDisplay" aria-live="polite"></div>
        </div>

        <!-- Main Output / Answer Line -->
        <div class="display-main-container">
          <div class="display-main" id="mainDisplay" aria-live="assertive">0</div>
        </div>

        <!-- Dynamic Real-time Preview -->
        <div class="display-preview-container">
          <div class="display-preview" id="previewDisplay"></div>
        </div>
      </div>

      <!-- Scientific Function Keypad (6 columns) -->
      <div class="keypad-section-label">
        <span>Scientific Functions</span>
      </div>
      <div class="keypad scientific-grid" role="group" aria-label="Scientific Operations">
        <!-- Row 1: Trigonometric & Inverse Trig -->
        <button class="calc-btn btn-sci" type="button" data-action="func" data-val="sin(" aria-label="Sine">sin</button>
        <button class="calc-btn btn-sci" type="button" data-action="func" data-val="cos(" aria-label="Cosine">cos</button>
        <button class="calc-btn btn-sci" type="button" data-action="func" data-val="tan(" aria-label="Tangent">tan</button>
        <button class="calc-btn btn-sci" type="button" data-action="func" data-val="sin⁻¹(" aria-label="Arcsine">sin⁻¹</button>
        <button class="calc-btn btn-sci" type="button" data-action="func" data-val="cos⁻¹(" aria-label="Arccosine">cos⁻¹</button>
        <button class="calc-btn btn-sci" type="button" data-action="func" data-val="tan⁻¹(" aria-label="Arctangent">tan⁻¹</button>

        <!-- Row 2: Logs, Roots, Exponentiation -->
        <button class="calc-btn btn-sci" type="button" data-action="func" data-val="log(" aria-label="Common Logarithm (base 10)">log</button>
        <button class="calc-btn btn-sci" type="button" data-action="func" data-val="ln(" aria-label="Natural Logarithm">ln</button>
        <button class="calc-btn btn-sci" type="button" data-action="func" data-val="√(" aria-label="Square Root">√</button>
        <button class="calc-btn btn-sci" type="button" data-action="square" aria-label="Square">x²</button>
        <button class="calc-btn btn-sci" type="button" data-action="power" aria-label="Exponent x to power y">xʸ</button>
        <button class="calc-btn btn-sci" type="button" data-action="reciprocal" aria-label="Reciprocal 1 divided by x">1/x</button>

        <!-- Row 3: Constants & Parentheses -->
        <button class="calc-btn btn-sci" type="button" data-action="const" data-val="π" aria-label="Pi">π</button>
        <button class="calc-btn btn-sci" type="button" data-action="const" data-val="e" aria-label="Euler's Constant e">e</button>
        <button class="calc-btn btn-sci" type="button" data-action="factorial" aria-label="Factorial">!</button>
        <button class="calc-btn btn-sci" type="button" data-action="paren" data-val="(" aria-label="Open Parenthesis">(</button>
        <button class="calc-btn btn-sci" type="button" data-action="paren" data-val=")" aria-label="Close Parenthesis">)</button>
        <button class="calc-btn btn-sci" type="button" data-action="negate" aria-label="Plus Minus Toggle">±</button>
      </div>

      <!-- Divider -->
      <div class="keypad-divider" aria-hidden="true"></div>

      <!-- Main Numeric Keypad (4 columns) -->
      <div class="keypad-section-label">
        <span>Numbers & Operations</span>
      </div>
      <div class="keypad main-grid" role="group" aria-label="Basic Operations and Numbers">
        <!-- Row 1 -->
        <button class="calc-btn btn-clear" type="button" data-action="clear" aria-label="All Clear">AC</button>
        <button class="calc-btn btn-delete" type="button" data-action="delete" aria-label="Backspace">⌫</button>
        <button class="calc-btn btn-operator" type="button" data-action="operator" data-val="%" aria-label="Percentage">%</button>
        <button class="calc-btn btn-operator" type="button" data-action="operator" data-val="÷" aria-label="Divide">÷</button>

        <!-- Row 2 -->
        <button class="calc-btn btn-number" type="button" data-action="num" data-val="7">7</button>
        <button class="calc-btn btn-number" type="button" data-action="num" data-val="8">8</button>
        <button class="calc-btn btn-number" type="button" data-action="num" data-val="9">9</button>
        <button class="calc-btn btn-operator" type="button" data-action="operator" data-val="×" aria-label="Multiply">×</button>

        <!-- Row 3 -->
        <button class="calc-btn btn-number" type="button" data-action="num" data-val="4">4</button>
        <button class="calc-btn btn-number" type="button" data-action="num" data-val="5">5</button>
        <button class="calc-btn btn-number" type="button" data-action="num" data-val="6">6</button>
        <button class="calc-btn btn-operator" type="button" data-action="operator" data-val="−" aria-label="Subtract">−</button>

        <!-- Row 4 -->
        <button class="calc-btn btn-number" type="button" data-action="num" data-val="1">1</button>
        <button class="calc-btn btn-number" type="button" data-action="num" data-val="2">2</button>
        <button class="calc-btn btn-number" type="button" data-action="num" data-val="3">3</button>
        <button class="calc-btn btn-operator" type="button" data-action="operator" data-val="+" aria-label="Add">+</button>

        <!-- Row 5 -->
        <button class="calc-btn btn-number" type="button" data-action="num" data-val="0">0</button>
        <button class="calc-btn btn-number" type="button" data-action="num" data-val="00">00</button>
        <button class="calc-btn btn-number" type="button" data-action="dot" data-val="." aria-label="Decimal point">.</button>
        <button class="calc-btn btn-equals" type="button" data-action="calculate" aria-label="Calculate equals">=</button>
      </div>
    </section>

    <!-- History Backdrop for Mobile Drawer -->
    <div class="history-backdrop" id="historyBackdrop" aria-hidden="true"></div>

    <!-- History Panel -->
    <aside class="history-panel" id="historyPanel" aria-label="Calculation History">
      <div class="history-header">
        <div class="history-title-group">
          <svg class="icon history-header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <h2 class="history-title">History</h2>
          <span class="history-count-tag" id="historyCountTag">0</span>
        </div>
        <div class="history-header-actions">
          <button id="clearHistoryBtn" class="history-action-btn clear-history-btn" type="button" title="Clear All History" aria-label="Clear History">
            <svg class="icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span>Clear</span>
          </button>
          <button id="closeHistoryBtn" class="history-action-btn close-history-btn" type="button" aria-label="Close History Panel">
            <svg class="icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- History List -->
      <div class="history-body" id="historyBody">
        <ul class="history-list" id="historyList" role="list">
          <!-- Dynamically populated calculation items -->
        </ul>
        <!-- Empty State -->
        <div class="history-empty" id="historyEmpty">
          <div class="empty-icon-wrap" aria-hidden="true">
            <span class="empty-emoji">🌸</span>
          </div>
          <p class="empty-title">No history yet</p>
          <p class="empty-subtitle">Calculations you complete will appear here and persist across refreshes.</p>
        </div>
      </div>

      <!-- History Footer / Tips -->
      <div class="history-footer">
        <span class="hint-text">💡 Tip: Click any history item to recall its result or formula</span>
      </div>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
